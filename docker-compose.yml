name: waschplan

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: waschplan
      POSTGRES_PASSWORD: waschplan
      POSTGRES_DB: waschplan_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U waschplan -d waschplan_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
